[project]
name = "backup-sentinel"
version = "0.1.0"
description = "Daily backup digest for Synology, Veeam, and QNAP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lukasz Paluch" }]
keywords = ["backup", "synology", "veeam", "qnap", "digest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
backup-sentinel = "backup_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/lp830623/CODEX_DEMO_backup-sentinel"
Source = "https://github.com/lp830623/CODEX_DEMO_backup-sentinel"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backup_sentinel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
